spring.application.name=campus-care-backend

# Database configuration (Supabase PostgreSQL)
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres.agjbudsvcqaaboczxsgk}
spring.datasource.password=${DB_PASSWORD:SRMKIMKC69BAAR}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA & Hibernate configuration
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

# Multipart file upload configuration (10 MB evidence upload)
spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

# Supabase Auth, Storage and API settings
supabase.url=${SUPABASE_URL:}
supabase.anon-key=${SUPABASE_ANON_KEY:}
supabase.service-role-key=${SUPABASE_SERVICE_ROLE_KEY:}
supabase.jwt-secret=${SUPABASE_JWT_SECRET:}
supabase.jwt-public-key=${SUPABASE_JWT_PUBLIC_KEY:}
supabase.jwt-issuer=${SUPABASE_JWT_ISSUER:}
supabase.jwt-audience=${SUPABASE_JWT_AUDIENCE:authenticated}
supabase.storage.bucket=${SUPABASE_STORAGE_BUCKET:issue-evidence}

# CORS configuration
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5500,http://127.0.0.1:5500,http://localhost:3000,http://localhost:8080,http://127.0.0.1:8080}
